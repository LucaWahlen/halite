services:
  halite:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/halite:latest
    ports:
      - "8080:8080"
    environment:
      HALITE_ADMIN_PASSWORD: ${HALITE_ADMIN_PASSWORD:?set HALITE_ADMIN_PASSWORD, e.g. in .env}
      HALITE_DB_PATH: /data/halite.db
      HALITE_UPLOADS_DIR: /data/uploads
    volumes:
      - halite-data:/data
    restart: unless-stopped

volumes:
  halite-data:
